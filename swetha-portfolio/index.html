<!DOCTYPE html>
<html>
    <head>
        <title>Swetha Prabakaran</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="main.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        >
    </head>
    <body>
        <div class="container-fluid content-section px-0">
            <div class="row w-100 g-0">
                <!-- Image Column (50% width on medium and larger screens) -->
                <div class="col-md-6 p-0 image-container">
                    <img class="img-fluid" src="/images/swetha-1.jpg" alt="An image of Swetha in a dance pose">
                </div>
                <!-- Text Column (50% width on medium and larger screens) -->
                <div class="col-md-6 d-flex align-items-center">
                    <div class="text-container m-2">
                        <h1 class="display-6 fw-bold mb-4">hello world, I'm Swetha!</h1>
                        <p class="lead">
                            I leverage the strengths of my dual artistic and engineering background to create widely impactful products, campaigns, and experiences.
                        </p>
                        <!-- Desktop Nav -->
                        <div class="home-nav-container mt-4 d-none d-md-flex">
                            <div class="nav-item">Recent Work</div>
                            <div class="nav-item">Speaking</div>
                            <div class="nav-item">About</div>
                            <div class="nav-item">Contact</div>
                        </div>
                        <!-- Mobile Hamburger -->
                        <div class="hamburger-menu d-md-none">
                            <input id="menu__toggle" type="checkbox">
                            <label class="menu__btn" for="menu__toggle">
                                <span></span>
                            </label>
                            <ul class="menu__box">
                                <li>
                                    <a class="menu__item" href="#">Recent Work</a>
                                </li>
                                <li>
                                    <a class="menu__item" href="#">Speaking</a>
                                </li>
                                <li>
                                    <a class="menu__item" href="#">About</a>
                                </li>
                                <li>
                                    <a class="menu__item" href="#">Contact</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Bootstrap JS Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
